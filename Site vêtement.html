<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Boutique Mode</title>

  <!-- Liaison du CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header>
    <h1>Fashion Style</h1>

    <nav>
      <a href="#">Accueil</a>
      <a href="#">Femmes</a>
      <a href="#">Hommes</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <!-- IMAGE PRINCIPALE -->
  <section class="hero">
    <h2>Nouvelle Collection 2026</h2>
  </section>

  <!-- PRODUITS -->
  <section class="products">

    <h2>Nos vêtements</h2>

    <div class="product-container">

      <!-- Produit 1 -->
      <div class="card">
        <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab" alt="T-shirt">

        <h3>T-shirt Blanc</h3>

        <p>Un t-shirt confortable et moderne.</p>

        <div class="price">29€</div>

        <button>Acheter</button>
      </div>

      <!-- Produit 2 -->
      <div class="card">
        <img src="https://images.unsplash.com/photo-1541099649105-f69ad21f3246" alt="Veste">

        <h3>Veste Jeans</h3>

        <p>Style tendance pour toutes saisons.</p>

        <div class="price">59€</div>

        <button>Acheter</button>
      </div>

      <!-- Produit 3 -->
      <div class="card">
        <img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f" alt="Robe">

        <h3>Robe Élégante</h3>

        <p>Parfaite pour les soirées.</p>

        <div class="price">79€</div>

        <button>Acheter</button>
      </div>

    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 Fashion Style</p>
  </footer>

</body>
</html>
